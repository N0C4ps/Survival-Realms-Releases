[package]
name = "SurvivalRealms"
version = "0.0.3"
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/sg-format",
    "crates/sg-installer",
    "crates/sg-launcher-core",
    "crates/sg-packager",
    "launcher/src-tauri",
]

[dependencies]
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
lz4_flex = "0.11"
noise = "0.9"
rayon = "1"
directories = "6"
glam = "0.30"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = { version = "0.35", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
rustc-hash = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "29"
winit = "0.30"

# The game loop is too CPU-heavy for Cargo's default opt-level 0 development
# profile. Keep debug information and incremental builds, but compile gameplay
# code moderately optimized and third-party crates fully optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Used only for binaries distributed through the launcher. Development builds
# remain fast, while packaged builds favor optimization and reverse-engineering
# resistance.
[profile.distribution]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
overflow-checks = false
