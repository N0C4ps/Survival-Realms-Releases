[package]
name = "sg-packager"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sg-format = { path = "../sg-format" }
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
