[package]
name = "sg-format"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
